# docker compose up --build   -> database + backend (http://localhost:8080) + frontend (http://localhost:3000)
#
# Environment variables (optional):
#   DB_CONNECTION  database connection string for the backend (default: the db service below)
#   API_URL        backend address used by the frontend (default: http://localhost:8080)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: final
    environment:
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION:-Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres}"
      PORT: "8080"
      HOLD_DURATION_SECONDS: "600"
      HOLD_EXPIRY_INTERVAL_SECONDS: "5"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: final
    environment:
      API_URL: "${API_URL:-http://localhost:8080}"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Tests (docker compose --profile test run --rm backend-tests / frontend-tests)
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DB_CONNECTION: "Host=db;Port=5432;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  pgdata:
